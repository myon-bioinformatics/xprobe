name: Lean verification

on:
  pull_request:
    paths:
      - "formal/**"
      - "xprobe.py"
      - "tests/test_formal_coverage_bridge.py"
      - ".github/workflows/lean-verification.yml"
  push:
    branches: [main]
    paths:
      - "formal/**"
      - "xprobe.py"
      - "tests/test_formal_coverage_bridge.py"
      - ".github/workflows/lean-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pair-coverage:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-lean-verify.yml@main
    with:
      project-directory: formal
      proof: Coverage.lean
      theorems: |
        Xprobe.covered_exact
        Xprobe.selected_prefix_monotone
        Xprobe.marginal_exact
