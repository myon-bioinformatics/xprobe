[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xprobe-dev"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "PyYAML>=6"]

# The installed artifact is one stdlib-only module; dev tools stay in dependency groups.
[tool.uv]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.11" }

[project.scripts]
xprobe = "xprobe:main"

[tool.setuptools]
py-modules = ["xprobe"]
